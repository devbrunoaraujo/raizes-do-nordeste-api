services:
  mysql:
    image: mysql:8.0
    container_name: raizes-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root123}
      MYSQL_DATABASE: ${DB_NAME:-raizes}
      MYSQL_USER: ${DB_USER:-raizes}
      MYSQL_PASSWORD: ${DB_PASSWORD:-raizes123}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
