spring.application.name=raizes-api

spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:raizes}?createDatabaseIfNotExist=true&serverTimezone=UTC
spring.datasource.username=${DB_USER:raizes}
spring.datasource.password=${DB_PASSWORD:raizes123}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

server.port=${SERVER_PORT:8080}

app.jwt.secret=${JWT_SECRET:troque-esta-chave-por-uma-com-no-minimo-32-caracteres}
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:60}

# Swagger / OpenAPI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.persist-authorization=true
springdoc.swagger-ui.display-request-duration=true
springdoc.default-produces-media-type=application/json