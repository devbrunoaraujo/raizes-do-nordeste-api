spring.application.name=raizes-api

spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:raizes}?createDatabaseIfNotExist=true&serverTimezone=UTC
spring.datasource.username=${DB_USER:raizes}
spring.datasource.password=${DB_PASSWORD:raizes123}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

server.port=${SERVER_PORT:8080}
